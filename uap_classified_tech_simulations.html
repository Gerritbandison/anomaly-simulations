  if(t>.65){const hp=(t-.65)/.35;
  const hmx=gx+30+hp*300,hmy=gy-10+hp*100;
  c.fillStyle='#aaa';c.save();c.translate(hmx,hmy);c.rotate(.3);c.fillRect(-8,-1.5,16,3);c.restore();
  ci(hmx+8,hmy,3,'rgba(255,200,100,.3)');
  if(hp>.8){ci(radX,radY,15+hp*20,`rgba(255,150,50,${(1-hp)*2})`)}}
  if(t>.85){tx('Jam → Destroy: suppressing enemy air defenses (SEAD)',W/2,H-20,`rgba(240,230,140,${Math.min(1,(t-.85)*6)})`,10)}
}},

{cat:"Electronic Warfare",id:"emp",nm:"Nuclear EMP Weapon",sub:"High-altitude detonation that fries electronics across a continent",
info:[["Type","HEMP (High-altitude EMP)"],["Range","1,500+ mile radius"],["Effect","Fries all unshielded electronics"],["Origin","Discovered during Starfish Prime"]],
desc:"A nuclear electromagnetic pulse (EMP) weapon detonated at high altitude (200-300 miles) generates three electromagnetic pulses: E1 (nanosecond spike that destroys microelectronics), E2 (similar to lightning), and E3 (slow pulse that overloads power grids). During the 1962 Starfish Prime test — a 1.4 megaton detonation at 250 miles altitude — streetlights blew out in Hawaii 900 miles away, and phone lines failed across the Pacific. A single warhead detonated over Kansas could theoretically disable electronics across the entire continental United States.",
d:function(t){
  nsky();st(40);
  tx('NUCLEAR EMP — High-Altitude Electromagnetic Pulse',W/2,25,'#50e8c0',13);
  // Earth curvature with grid
  c.fillStyle='rgba(20,60,40,.3)';c.beginPath();c.arc(W/2,H+250,350,Math.PI,Math.PI*2);c.fill();
  // US outline (simplified)
  c.strokeStyle='rgba(80,200,150,.2)';c.lineWidth=1;c.beginPath();c.arc(W/2,H+250,350,Math.PI+.3,Math.PI*2-.3);c.stroke();
  // City lights
  for(let i=0;i<20;i++){const cx3=200+i*30+Math.sin(i*3)*20,cy3=H-100-Math.sin((i*30/350)*Math.PI)*50;
  if(t<.35||Math.random()>.5*(t-.35)*3){ci(cx3,cy3,2,'rgba(255,200,100,.4)')}}
  // Warhead ascending
  if(t<.25){const rp=t/.25;
  const rx=W/2,ry=H-50-rp*280;
  c.fillStyle='#aaa';c.fillRect(rx-2,ry-8,4,16);
  for(let i=0;i<3;i++){pl(rx,ry+8,Math.PI/2+Math.random()*.5,15,6,'rgba(255,150,50,.3)')}}
  // Detonation
  if(t>.25&&t<.5){const dp=(t-.25)/.25;
  const flashR=dp*300;
  ci(W/2,H-330,flashR*.3,`rgba(255,255,255,${(1-dp)*.8})`);
  ci(W/2,H-330,flashR,`rgba(255,200,100,${(1-dp)*.1})`)}
  // EMP wave expanding
  if(t>.3){const ep=(t-.3)/.7;
  const empR=ep*500;
  c.strokeStyle=`rgba(100,200,255,${.3*(1-ep)})`;c.lineWidth=3;c.beginPath();c.arc(W/2,H-330,empR,.3,Math.PI-.3);c.stroke();
  c.strokeStyle=`rgba(100,200,255,${.15*(1-ep)})`;c.lineWidth=1;c.beginPath();c.arc(W/2,H-330,empR*1.1,.3,Math.PI-.3);c.stroke()}
  // Lights going out
  if(t>.4){const blk=(t-.4)/.3;
  tx('Electronics failing across 1,500-mile radius',W/2,H-20,`rgba(240,230,140,${Math.min(1,blk*2)})`,10)}
  // E1, E2, E3 labels
  if(t>.35){const la=Math.min(1,(t-.35)*3);
  tx('E1: Nanosecond spike → destroys microchips',180,100,`rgba(255,100,100,${la*.6})`,9,'left');
  tx('E2: Millisecond pulse → like lightning',180,120,`rgba(255,200,100,${la*.6})`,9,'left');
  tx('E3: Slow pulse → overloads power grid',180,140,`rgba(100,200,255,${la*.6})`,9,'left')}
}},

// ═══ EXOTIC CONCEPTS ═══
{cat:"Exotic Concepts",id:"project1794",nm:"Project 1794 (CIA Flying Saucer)",sub:"1950s — USAF/CIA actually tried to build a flying saucer",
info:[["Year","1952-1961"],["Builder","Avro Canada"],["Goal","VTOL Mach 4 at 100k ft"],["Result","Wobbled at 3 ft altitude"]],
desc:"Project 1794 (also known as the Avrocar) was an actual US military attempt to build a flying saucer. Declassified in 2012, the project was contracted to Avro Canada to build a disc-shaped VTOL aircraft that could reach Mach 4 at 100,000+ feet — fast enough to intercept Soviet bombers. The resulting VZ-9 Avrocar looked exactly like a stereotypical UFO but could barely hover 3 feet off the ground and became wildly unstable at any speed. The project burned through $10 million before cancellation in 1961. The real saucer is now in the National Museum of the USAF.",

  // Test pad
  c.fillStyle='#888';c.fillRect(350,378,220,8);
  // Avrocar
  const avY=t<.3?378:378-Math.min(12,(t-.3)*30)+Math.sin(t*15)*((t-.3)*10);

  c.save();c.translate(460,avY);c.rotate(wobble*.01);
  // Disc body
  c.fillStyle='#889';c.beginPath();c.ellipse(0,0,50,18,0,0,Math.PI*2);c.fill();
  c.fillStyle='#99a';c.beginPath();c.ellipse(0,-5,30,12,0,0,Math.PI*2);c.fill();
  // Cockpit
  c.fillStyle='rgba(150,200,255,.3)';c.beginPath();c.ellipse(0,-8,12,8,0,Math.PI,Math.PI*2);c.fill();
  // Exhaust glow
  if(t>.25){ci(0,10,25,`rgba(255,200,100,${.1+Math.sin(t*20)*.05})`)}
  c.restore();
  // Height indicator
