const S=[
// ── NUCLEAR THERMAL ──
{cat:"Nuclear Thermal",id:"nerva",name:"NERVA Engine",
sub:"Nuclear Engine for Rocket Vehicle Application — tested 1960s",
info:[["Thrust","75,000 lbf"],["Isp","841 seconds"],["Reactor","Graphite-core, solid"],["Program","1960–1973"]],
desc:"NERVA (Nuclear Engine for Rocket Vehicle Application) was a joint NASA/AEC program that successfully ground-tested nuclear thermal rocket engines. The concept is simple: a nuclear fission reactor heats hydrogen propellant to extreme temperatures (~2,500°C), then expels it through a nozzle at tremendous velocity. NERVA achieved roughly twice the specific impulse (efficiency) of the best chemical rockets. The program completed 23 successful reactor tests at Jackass Flats, Nevada before being cancelled in 1973 due to budget cuts — not technical failure. It remains the most mature nuclear propulsion technology ever developed.",
draw:drawNerva},

{cat:"Nuclear Thermal",id:"ntr",name:"Nuclear Thermal Rocket (Cutaway)",
sub:"How a solid-core NTR works — reactor heats propellant directly",
info:[["Core temp","~2,500°C"],["Propellant","Liquid hydrogen"],["Isp","800–1000 s"],["vs Chemical","2× more efficient"]],
desc:"A nuclear thermal rocket passes hydrogen propellant through a hot fission reactor core. The hydrogen is heated to extreme temperatures and expands out a nozzle at velocities far exceeding any chemical combustion. The reactor core contains hundreds of fuel elements — typically uranium carbide or uranium oxide in a graphite or ceramic matrix — with channels running through them for the hydrogen to flow. Control drums around the core rotate to expose neutron-reflecting material, controlling the reaction rate. The key advantage: you're limited only by how hot you can make the reactor, not by combustion chemistry.",
draw:drawNTR},

{cat:"Nuclear Thermal",id:"bimodal",name:"Bimodal NTR (BNTR)",
sub:"Dual-mode: thrust for maneuvers + electricity for cruise",
info:[["Thrust mode","~25,000 lbf"],["Electric mode","25–50 kWe"],["Use case","Mars transit vehicle"],["Isp","900+ seconds"]],
desc:"A Bimodal Nuclear Thermal Rocket operates in two modes. In thrust mode, it functions like a standard NTR — heating hydrogen through the reactor core for high-thrust maneuvers like Earth departure and Mars orbit insertion. In electric mode, the reactor runs at low power to generate electricity via a Brayton or Stirling cycle, powering ion thrusters, life support, and communications during the long cruise phase. This dual capability is considered ideal for crewed Mars missions because you get the high thrust needed for fast transits plus reliable power for months of cruise.",
draw:drawBimodal},

{cat:"Nuclear Thermal",id:"gcr",name:"Gas-Core Nuclear Rocket",
sub:"Uranium plasma contained by vortex — 3,000+ seconds Isp",
info:[["Core temp","25,000–55,000°C"],["Isp","3,000–7,000 s"],["Fuel state","Gaseous/plasma uranium"],["Challenge","Containing the fuel"]],
desc:"The gas-core nuclear rocket takes the NTR concept to its extreme: instead of solid fuel elements, the fissioning uranium is a superheated gas or plasma suspended in the center of the engine by a vortex of hydrogen propellant. Because there are no solid materials to melt, temperatures can reach 25,000–55,000°C — far beyond any solid-core design. The hydrogen propellant flows around and through the uranium plasma, absorbing enormous heat before exhausting through the nozzle. The 'open cycle' variant vents some uranium with the exhaust (higher performance, radioactive exhaust). The 'closed cycle' keeps the uranium contained behind a transparent wall (lower performance, cleaner exhaust). Neither has been built, but the physics is sound.",
draw:drawGasCore},

// ── NUCLEAR PULSE ──
{cat:"Nuclear Pulse",id:"orion",name:"Project Orion",
sub:"Propelled by sequential nuclear explosions — 1958-1965",
info:[["Concept","Nuclear pulse propulsion"],["Isp","6,000–100,000+ s"],["Payload","Thousands of tons"],["Killed by","Test Ban Treaty (1963)"]],
desc:"Project Orion is perhaps the most audacious propulsion concept ever seriously studied. The spacecraft rides a massive 'pusher plate' — a thick steel or aluminum disk. Small nuclear bombs (shaped charges) are ejected behind the plate and detonated at a distance, one every few seconds. The plasma from each explosion slams into the pusher plate, pushing the ship forward. Shock absorbers between the plate and the crew compartment smooth out the ride. The concept was studied at General Atomics by Freeman Dyson and Ted Taylor from 1958–1965. The math works — an Orion ship could reach Mars in weeks and carry thousands of tons of payload. It was killed by the Partial Test Ban Treaty banning atmospheric nuclear explosions, not by any engineering impossibility.",
draw:drawOrion},

{cat:"Nuclear Pulse",id:"medusa",name:"Medusa Sail",
sub:"Nuclear pulse variant — explosions push a giant sail ahead of the ship",
info:[["Concept","Spinnaker sail + nukes"],["Advantage","Lighter than Orion"],["Sail","Large parachute-like canopy"],["Status","Conceptual only"]],
desc:"Medusa is a variant of Orion that replaces the heavy pusher plate with a large, lightweight sail (like a spinnaker or parachute) deployed AHEAD of the spacecraft. Nuclear charges are detonated behind the ship, and the blast wave inflates and pushes the sail forward via long tethers connected to the payload. The key advantage over Orion: the sail can be much lighter than a pusher plate because it flexes and absorbs the impulse over a longer time, and the tethers provide natural shock absorption. The payload hangs below on cables that reel in and out to smooth the ride. It's mechanically simpler and potentially more mass-efficient than Orion, though it's never progressed beyond paper studies.",
draw:drawMedusa},

{cat:"Nuclear Pulse",id:"nswr",name:"Nuclear Salt Water Rocket",
sub:"Fissioning uranium solution flows continuously through the engine",
info:[["Concept","Aqueous fission flow"],["Isp","6,700–67,000 s"],["Fuel","Uranium salts in water"],["Designer","Robert Zubrin"]],
desc:"Conceived by Robert Zubrin, the Nuclear Salt Water Rocket dissolves highly enriched uranium salts in water. The solution is stored in a bundle of neutron-absorbing boron-lined tubes (keeping it subcritical). When the engine fires, the solution is pumped into a reaction chamber where — free of the absorbing tubes — it goes critical and the water flashes to superheated plasma, expelled out the nozzle at tremendous velocity. It's essentially a continuous nuclear detonation in a controlled flow. The exhaust is obviously extremely radioactive, so it's only usable in deep space. But the performance numbers are extraordinary — potentially matching Orion without requiring pre-manufactured bombs.",
draw:drawNSWR},

// ── ELECTRIC PROPULSION ──
{cat:"Electric / Ion",id:"ion",name:"Ion Thruster",
sub:"Electrostatic acceleration of ionized propellant — extreme efficiency",
info:[["Thrust","~0.5 N (very low)"],["Isp","1,500–10,000+ s"],["Propellant","Xenon, krypton"],["Used on","Dawn, Starlink, DART"]],
desc:"Ion thrusters work by ionizing a propellant (typically xenon gas) and accelerating the ions through an electric field to extremely high velocities — 30–50 km/s, compared to ~4.5 km/s for chemical rockets. The thrust is tiny (you could barely feel it on your hand), but the efficiency is extraordinary. Running continuously for months or years, ion engines can achieve total velocity changes far beyond any chemical system. The tradeoff: you need a power source (solar panels or a nuclear reactor) to generate the electricity. NASA's Dawn spacecraft used ion propulsion to orbit both Vesta and Ceres — a mission impossible with chemical rockets.",
draw:drawIon},

{cat:"Electric / Ion",id:"vasimr",name:"VASIMR Engine",
sub:"Variable Specific Impulse Magnetoplasma Rocket",
info:[["Thrust","Up to 6 N"],["Isp","3,000–30,000 s (variable)"],["Key feature","Adjustable thrust/Isp"],["Developer","Ad Astra (Franklin Chang-Díaz)"]],
desc:"VASIMR uses radio waves to ionize and heat a propellant (argon or hydrogen) into a plasma, then a magnetic nozzle channels and accelerates the plasma out the back. The breakthrough feature: you can dynamically trade between thrust and efficiency. Need high thrust for a maneuver? Dial up the mass flow and accept lower Isp. Want maximum efficiency for a long cruise? Reduce flow and boost Isp. This variable gear ratio is unique among electric engines. Developed by astronaut Franklin Chang-Díaz, VASIMR has been tested on the ground and proposed for ISS reboost. A nuclear-powered VASIMR could theoretically get a crew to Mars in 39 days.",
draw:drawVasimr},

{cat:"Electric / Ion",id:"mpd",name:"Magnetoplasmadynamic Thruster",
sub:"Lorentz force accelerates plasma — highest thrust of any electric engine",
info:[["Thrust","Up to 200 N"],["Isp","1,500–10,000 s"],["Power req","100 kW – 1 MW+"],["Advantage","Highest electric thrust"]],
desc:"MPD thrusters use the Lorentz force (the interaction between an electric current through a plasma and a magnetic field) to accelerate propellant to very high velocities. An arc discharge ionizes the propellant between a central cathode and cylindrical anode. The current flowing through the plasma interacts with the self-generated magnetic field, creating a force that pushes the plasma out at high speed. MPDs produce far more thrust than ion engines or Hall thrusters — potentially hundreds of newtons — making them suitable for crewed missions. The catch: they need enormous power (hundreds of kilowatts to megawatts), which practically requires a nuclear reactor.",
draw:drawMPD},

{cat:"Electric / Ion",id:"hall",name:"Hall Effect Thruster",
sub:"Crossed electric and magnetic fields trap electrons, accelerate ions",
info:[["Thrust","~1 N"],["Isp","1,500–3,000 s"],["Used on","Starlink, many satellites"],["Heritage","Soviet SPT since 1970s"]],
desc:"Hall thrusters use a radial magnetic field to trap electrons in a circular drift (the Hall current). These orbiting electrons ionize the propellant and create an electric field that accelerates ions out the back at 15–30 km/s. Simpler and more robust than gridded ion engines, Hall thrusters have been workhorses of the space industry since the Soviets flew the first SPT-60 in 1971. SpaceX uses krypton-fueled Hall thrusters on every Starlink satellite for orbit raising and station-keeping. They hit a sweet spot between thrust and efficiency that makes them ideal for satellite propulsion.",
draw:drawHall},

// ── FUSION PROPULSION ──
{cat:"Fusion",id:"daedalus",name:"Project Daedalus",
sub:"British Interplanetary Society — unmanned fusion starship to Barnard's Star",
info:[["Target","Barnard's Star (5.9 ly)"],["Speed","12% speed of light"],["Fuel","He-3/D pellets"],["Transit","~50 years"]],
desc:"Project Daedalus (1973–1978) was the first detailed engineering study of an interstellar spacecraft. Designed by the British Interplanetary Society, it would use inertial confinement fusion — firing electron beams at pellets of deuterium and helium-3, igniting 250 fusion micro-explosions per second. The exhaust velocity would reach 10,000 km/s, accelerating the 54,000-ton ship to 12% the speed of light. It would reach Barnard's Star in about 50 years, performing a flyby (no deceleration — that would require even more fuel). The design called for mining Jupiter's atmosphere for helium-3, which gives a sense of the scale involved.",
draw:drawDaedalus},

{cat:"Fusion",id:"icf",name:"Inertial Confinement Fusion Drive",
sub:"Fuel pellets compressed by lasers or particle beams — pulsed fusion",
info:[["Concept","Micro-fusion explosions"],["Ignition","Laser/beam compression"],["Isp","100,000+ s"],["Challenge","Net energy gain"]],
desc:"Inertial confinement fusion propulsion fires intense energy beams (lasers or particle beams) at tiny fuel pellets from all sides simultaneously. The pellet's outer layer ablates outward, driving the core inward via Newton's third law — compressing and heating it until fusion ignites. The miniature explosion is directed by a magnetic nozzle to produce thrust. Each pellet produces a brief pulse of energy; fire hundreds per second and you get continuous thrust. The NIF facility at Lawrence Livermore achieved fusion ignition in December 2022, demonstrating laboratory fusion ignition; this did not demonstrate a propulsion engine, which remains an engineering challenge.",
draw:drawICF},

{cat:"Fusion",id:"mcf",name:"Magnetic Confinement Fusion Drive",
sub:"Tokamak or field-reversed configuration confines plasma for steady thrust",
info:[["Concept","Magnetically confined plasma"],["Approach","FRC, Tokamak, Spheromak"],["Isp","10,000–300,000 s"],["Key","Sustained burn, no pellets"]],
desc:"Instead of pulsed micro-explosions, magnetic confinement fusion drives hold a continuous fusion plasma in a magnetic bottle and allow it to leak out one end as directed exhaust. A Field-Reversed Configuration (FRC) is the most promising for propulsion — it creates a self-contained plasma torus that can be translated along a magnetic field and ejected at enormous velocity. Companies like Helion Energy and TAE Technologies are developing FRC reactors on the ground. For space, Princeton's PFRC (Princeton Field-Reversed Configuration) is specifically designed as a compact fusion engine. The advantage over ICF: continuous thrust without the complexity of pellet fabrication and precision targeting.",
draw:drawMCF},

// ── EXOTIC CONCEPTS ──
{cat:"Exotic Concepts",id:"pluto",name:"Project Pluto (SLAM)",
sub:"Nuclear-powered ramjet cruise missile — 1960s DARPA nightmare",
info:[["Type","Nuclear ramjet"],["Speed","Mach 3+ at treetop level"],["Reactor","Unshielded, direct-cycle"],["Status","Tested reactor, never flew"]],
desc:"Project Pluto was a Cold War program to build a nuclear-powered cruise missile called SLAM (Supersonic Low-Altitude Missile). Air entered the ramjet intake at Mach 3+, passed directly through an unshielded nuclear reactor (heating it to enormous temperatures), and exhausted out the back for thrust — no moving parts, unlimited range. The missile would fly at treetop level below radar, dropping hydrogen bombs on Soviet targets one by one. The reactor exhaust itself was lethally radioactive, so the flight path alone would be a weapon. Two reactors (Tory II-A and Tory II-C) were successfully tested at full power on railcars in the Nevada desert. The program was cancelled partly because it was too destabilizing — and partly because ICBMs made it redundant.",
draw:drawPluto},

{cat:"Exotic Concepts",id:"alcubierre",name:"Alcubierre Warp Drive",
sub:"Contracting space ahead, expanding behind — moving without moving",
info:[["Concept","Spacetime metric engineering"],["Speed","Effectively FTL"],["Proposed","Miguel Alcubierre, 1994"],["Requires","Exotic matter (negative energy)"]],
desc:"Mexican physicist Miguel Alcubierre showed in 1994 that General Relativity technically permits a 'warp bubble' — a region of flat spacetime that moves through the surrounding spacetime by contracting space ahead of it and expanding space behind it. The ship inside the bubble is locally stationary (no acceleration, no time dilation), but the bubble itself moves at arbitrary velocity — even faster than light. The catch: the original formulation required more negative energy than exists in the observable universe. Subsequent refinements (by White, Bobrick, Martire, and Lentz) have reduced the energy requirements enormously, and Erik Lentz showed in 2021 that certain warp solutions might work with only positive energy. Still firmly theoretical, but no longer obviously impossible.",
draw:drawAlcubierre},

{cat:"Exotic Concepts",id:"bussard",name:"Bussard Ramjet",
sub:"Scooping interstellar hydrogen as fuel — unlimited range",
info:[["Concept","Interstellar fuel scoop"],["Proposed","Robert Bussard, 1960"],["Scoop","Magnetic funnel, 1000s km"],["Problem","Drag exceeds thrust"]],
desc:"The Bussard Ramjet uses an enormous magnetic field (potentially thousands of kilometers across) to scoop up the sparse hydrogen atoms drifting in interstellar space and funnel them into a fusion reactor. Since you're collecting fuel as you go, you never run out — in principle, you could accelerate indefinitely and reach relativistic speeds. The concept inspired countless science fiction works. Unfortunately, detailed analysis showed that the drag from the magnetic scoop collecting interstellar medium likely exceeds the thrust from fusing the collected hydrogen, making it a brake rather than an engine at most speeds. Variations using the scoop only for deceleration (after being accelerated by other means) remain viable.",
draw:drawBussard},

{cat:"Exotic Concepts",id:"solar",name:"Solar / Laser Sail",
sub:"Riding photon pressure — no propellant needed",
info:[["Concept","Radiation pressure propulsion"],["Demonstrated","IKAROS (JAXA, 2010)"],["Starshot target","20% speed of light"],["Advantage","No fuel mass"]],
desc:"Solar sails use the pressure of photons (sunlight or laser beams) bouncing off a large, highly reflective surface to generate thrust. The force is tiny, but it's continuous and requires zero propellant. JAXA's IKAROS demonstrated solar sailing in 2010. The Breakthrough Starshot initiative proposes using a ground-based laser array to accelerate gram-scale probes with tiny sails to 20% the speed of light, reaching Alpha Centauri in about 20 years. For larger payloads, solar sails are best suited for inner solar system missions where sunlight is intense. The sail material must be extremely thin and reflective — aluminum-coated Mylar or carbon fiber just a few atoms thick.",
draw:drawSolarSail},

{cat:"Exotic Concepts",id:"emfield",name:"Electromagnetic Catapult / Mass Driver",
sub:"Railgun-style launch from planetary surfaces",
info:[["Concept","Electromagnetic acceleration"],["Type","Coilgun / railgun"],["Use case","Lunar/asteroid launch"],["Advantage","No propellant needed"]],
desc:"A mass driver or electromagnetic catapult uses a series of electromagnetic coils (like a linear motor or coilgun) to accelerate a payload along a track to orbital or escape velocity without any onboard propellant. On Earth, the required track length and g-forces make it impractical for crewed launch, but on the Moon (no atmosphere, 1/6 gravity) a mass driver could loft payloads into orbit or toward Earth cheaply and repeatedly. Gerard O'Neill proposed lunar mass drivers in the 1970s as a way to launch raw materials for space colony construction. The US Navy's electromagnetic aircraft launch system (EMALS) on Ford-class carriers demonstrates the core technology at smaller scale.",
draw:drawMassDriver},

// ── FISSION SYSTEMS ──
{cat:"Fission Reactors",id:"kilopower",name:"Kilopower / KRUSTY",
sub:"NASA's compact fission reactor for Moon and Mars surface power",
info:[["Power","1–10 kWe"],["Fuel","Uranium-235 (93% enriched)"],["Tested","2018 (full power)"],["Mass","~400 kg (1 kWe)"]],
desc:"Kilopower is a small, simple fission reactor designed by NASA and Los Alamos National Lab to provide reliable electricity on the Moon or Mars surface. The reactor core is a solid cast uranium-235 cylinder about the size of a paper towel roll. Heat from fission is transferred via sodium heat pipes to Stirling engines that generate electricity. The KRUSTY (Kilopower Reactor Using Stirling Technology) prototype was successfully tested at full power in 2018 in Nevada. The design is elegant in its simplicity — it self-regulates via negative thermal feedback (as it heats up, it naturally reduces its reaction rate). Four 10-kWe units could power a Mars habitat indefinitely.",
draw:drawKilopower},

{cat:"Fission Reactors",id:"msr",name:"Molten Salt Reactor",
sub:"Fuel dissolved in liquid salt — passive safety depends on the design",
info:[["Fuel","Uranium/thorium in fluoride salt"],["Temp","650–750°C"],["Safety feature","Potential passive fuel drainage"],["Heritage","MSRE (Oak Ridge, 1960s)"]],
desc:"In a molten salt reactor, the nuclear fuel is dissolved directly in a liquid fluoride or chloride salt that serves as both fuel and coolant. Liquid fuel changes the accident scenarios. Some designs use a freeze plug and gravity drainage into a dump tank; containment and decay-heat removal still require a safety analysis. The concept was proven at Oak Ridge National Lab in the 1960s with the Molten Salt Reactor Experiment (MSRE), which ran successfully for 4 years. MSRs can burn thorium (3× more abundant than uranium), consume existing nuclear waste, and operate at low pressure (which does not eliminate all accident risks). Multiple companies are now racing to commercialize the technology.",
draw:drawMSR},

{cat:"Fission Reactors",id:"rtg",name:"Radioisotope Thermoelectric Generator",
sub:"Plutonium-238 decay heat → electricity — powers Voyager, Curiosity, Perseverance",
info:[["Fuel","Plutonium-238"],["Power","~110 We per unit"],["Half-life","87.7 years"],["Notable","Voyager 1 (since 1977)"]],
desc:"An RTG converts the heat from radioactive decay of plutonium-238 into electricity via thermocouples (no moving parts). They're incredibly reliable — Voyager 1's RTGs have been running continuously since 1977 and are still powering the spacecraft in interstellar space, nearly 50 years later. Every Mars rover since Curiosity uses a Multi-Mission RTG (MMRTG). The beauty is simplicity: Pu-238 decays steadily for decades, the thermocouples have no moving parts to fail, and the output is independent of sunlight. The downside: Pu-238 is expensive to produce (~$8 million per kilogram), and each RTG generates only about 110 watts — enough for a rover, not for a habitat.",
draw:drawRTG},

{cat:"Fission Reactors",id:"pebblebed",name:"Pebble Bed Reactor",
sub:"Fuel in billiard-ball-sized pebbles — high-temperature fuel containment",
info:[["Fuel form","TRISO fuel pebbles"],["Coolant","Helium gas"],["Temp","~900°C outlet"],["Safety","Design-dependent heat removal"]],
desc:"A pebble bed reactor uses thousands of billiard-ball-sized graphite spheres, each containing thousands of tiny TRISO (TRi-structural ISOtropic) fuel particles — uranium kernels coated with layers of carbon and silicon carbide that act as miniature containment vessels. Hot helium gas flows through the gaps between the pebbles, carrying heat to a turbine. TRISO coatings help retain fission products at high temperatures. Negative temperature feedback can reduce reactor power as temperature rises, but fuel limits and decay-heat removal still require analysis. China's HTR-PM is the first commercial pebble bed reactor, connected to the grid in 2023.",
draw:drawPebbleBed},

{cat:"Fission Reactors",id:"snap",name:"SNAP-10A (Space Reactor)",
sub:"First nuclear reactor operated in space — 1965",
info:[["Power","500 We"],["Orbit","Launched April 1965"],["Duration","43 days in space"],["Coolant","NaK (sodium-potassium)"]],
desc:"SNAP-10A was the first (and so far only) US nuclear fission reactor to operate in orbit. Launched in April 1965, it used a compact uranium-zirconium hydride reactor cooled by liquid NaK (sodium-potassium alloy), with thermoelectric converters generating 500 watts of electricity. It operated successfully for 43 days before a voltage regulator failure (unrelated to the reactor) shut it down. The reactor and its payload remain in a 700-year orbit. The Soviet Union was far more prolific, orbiting over 30 RORSAT reactors to power ocean surveillance radar satellites. SNAP-10A proved that fission reactors work fine in space — the engineering challenges are political and regulatory, not technical.",
draw:drawSNAP}
];

function filterLibrary(){
  const query=search.value.trim().toLowerCase();
  const shown=S.filter(sim=>`${sim.name} ${sim.cat} ${sim.sub}`.toLowerCase().includes(query));
  document.querySelectorAll('.sb').forEach(button=>button.hidden=!shown.some(sim=>sim.id===button.dataset.id));
  document.querySelectorAll('.cat').forEach(heading=>heading.hidden=!shown.some(sim=>sim.cat===heading.dataset.category));
  document.getElementById('searchStatus').textContent=shown.length ? `${shown.length} of ${S.length} concepts` : 'No matching concepts. Clear the search to show all.';
}
search.addEventListener('input',filterLibrary);filterLibrary();
function cancelFrame(){if(af!==null)cancelAnimationFrame(af);af=null;lastTimestamp=null;}
function updatePlayback(){
  document.getElementById('pB').textContent=on?'⏸ Pause':t>=1?'↺ Replay':'▶ Play';
  document.getElementById('pB').setAttribute('aria-pressed',String(on));
  document.getElementById('seek').value=Math.round(t*1000);
  document.getElementById('seek').setAttribute('aria-valuetext',`${Math.round(t*100)} percent of illustration`);
  document.getElementById('progress').textContent=`${Math.round(t*100)}%`;
  const status=document.hidden&&on?'Suspended while hidden':on?'Playing':t>=1?'Complete':'Paused';
  const statusElement=document.getElementById('playbackStatus');
  if(statusElement.textContent!==status)statusElement.textContent=status;
}
function scheduleFrame(){if(on&&!document.hidden&&af===null)af=requestAnimationFrame(an);}
function ld(id){
  const sim=S.find(value=>value.id===id);if(!sim)return;
  cancelFrame();cur=sim;t=0;on=false;
  document.getElementById('sT').textContent=sim.name;
  document.getElementById('sS').textContent=sim.sub;
  document.getElementById('dB').textContent=sim.desc;
  document.getElementById('iP').innerHTML=sim.info.map(([label,value])=>`<div class="ic"><div class="l">${label}</div><div class="v">${value}</div></div>`).join('');
  const caveat=sim.id==='alcubierre'?'The warp scene is a speculative spacetime illustration; it does not demonstrate a buildable drive or faster-than-light travel.':sim.cat==='Fusion'||['bimodal','gcr','orion','medusa','nswr','bussard','emfield'].includes(sim.id)?'This is a proposed-system illustration. Displayed performance ranges are concept assumptions, not demonstrated engine capabilities.':sim.id==='solar'?'Solar sailing and proposed laser-driven interstellar missions have different evidence bases; the Starshot figures are targets.':'Historical examples and general principles are mixed with design-specific figures; the animation does not validate those figures.';
  document.getElementById('evidence').textContent=`Conceptual animation · not to scale. ${caveat} Cards are reference figures from the original narrative, not calculated outputs. Playback progress is an illustration sequence, not physical elapsed time.`;
  C.setAttribute('aria-label',`${sim.name}: conceptual illustration, not to scale`);
  document.querySelectorAll('.sb').forEach(button=>{const active=button.dataset.id===id;button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','true');else button.removeAttribute('aria-current');});
  dr();updatePlayback();
}
function tog(){
  cancelFrame();on=!on;
  if(on&&t>=1){t=0;dr();}
  updatePlayback();scheduleFrame();
}
function rst(){cancelFrame();t=0;on=false;dr();updatePlayback();}
function an(timestamp){
  af=null;if(!on||document.hidden)return;
  const delta=lastTimestamp===null?0:Math.max(0,Math.min(0.1,(timestamp-lastTimestamp)/1000));
  lastTimestamp=timestamp;t=Math.min(1,t+delta*Number(document.getElementById('speed').value)/DURATION);
  if(t>=1){on=false;lastTimestamp=null;}
  dr();updatePlayback();scheduleFrame();
}
function dr(){
  if(!cur)return;
  visualSeed=1+Math.round(t*10000);
  x.save();
  try{x.clearRect(0,0,W,H);cur.draw(t);}finally{x.restore();}
}
document.getElementById('seek').addEventListener('input',event=>{cancelFrame();on=false;t=Number(event.target.value)/1000;dr();updatePlayback();});
document.getElementById('speed').addEventListener('change',()=>{cancelFrame();scheduleFrame();});
document.addEventListener('visibilitychange',()=>{cancelFrame();updatePlayback();scheduleFrame();});
window.addEventListener('pagehide',cancelFrame);
window.addEventListener('pageshow',scheduleFrame);

// HELPERS
function bg(c1,c2){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,W,H)}
function stars(n){x.fillStyle='rgba(255,255,255,0.5)';for(let i=0;i<n;i++){x.beginPath();x.arc((i*173+31)%W,(i*97+17)%H,0.4+(i%3)*0.3,0,Math.PI*2);x.fill()}}
function txt(s,cx,cy,c,sz,al){x.fillStyle=c||'#888';x.font=(sz||11)+'px sans-serif';x.textAlign=al||'center';x.fillText(s,cx,cy)}
function lerp(a,b,p){return a+(b-a)*Math.max(0,Math.min(1,p))}
function ease(p){return p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2}

// Exhaust plume helper
function plume(cx,cy,angle,len,width,color,t,spread){
  const s=spread||0.3;
  x.save();x.translate(cx,cy);x.rotate(angle);
  const g=x.createLinearGradient(0,0,len,0);
  g.addColorStop(0,color);g.addColorStop(0.3,color.replace(/[\d.]+\)$/,`${0.6})`));g.addColorStop(1,color.replace(/[\d.]+\)$/,'0)'));
  x.fillStyle=g;
  x.beginPath();x.moveTo(0,-width/2);
  x.quadraticCurveTo(len*0.3,-width/2-len*s*random()*0.3,len,-width*2*random());
  x.quadraticCurveTo(len*0.3,width/2+len*s*random()*0.3,0,width/2);
  x.fill();
  // hot core
  const g2=x.createLinearGradient(0,0,len*0.5,0);
  g2.addColorStop(0,'rgba(255,255,255,0.6)');g2.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g2;
  x.beginPath();x.moveTo(0,-width*0.3);x.lineTo(len*0.4,0);x.lineTo(0,width*0.3);x.fill();
  x.restore();
}

// Particle array for reuse
function particles(arr,cx,cy,count,spread,speed,color,sz){
  while(arr.length<count)arr.push({x:cx,y:cy,vx:(random()-0.5)*spread,vy:(random()-0.5)*spread,life:random()});
  arr.forEach(p=>{
    p.x+=p.vx*speed;p.y+=p.vy*speed;p.life-=0.008;
    if(p.life<=0){p.x=cx;p.y=cy;p.vx=(random()-0.5)*spread;p.vy=(random()-0.5)*spread;p.life=1}
    x.fillStyle=color.replace('A',p.life*0.7);
    x.beginPath();x.arc(p.x,p.y,sz*p.life,0,Math.PI*2);x.fill();
  });
}

function drawNerva(t){

  const coreGlow=0.3+Math.sin(t*20)*0.1*(t>0.15?1:0);
  x.fillStyle=`rgba(50,200,100,${coreGlow})`;x.fillRect(ex-60,ey-35,120,70);
  // Fuel elements (channels)
  for(let i=0;i<8;i++){
    x.fillStyle='#1a1a30';x.fillRect(ex-50+i*14,ey-30,8,60);
    if(t>0.15){x.fillStyle=`rgba(100,200,255,${0.3+random()*0.2})`;x.fillRect(ex-50+i*14+2,ey-30,4,60)}
  }
  txt('Reactor Core',ex,ey-45,'#5a8',9);
  // Nozzle
  x.fillStyle='#445';x.beginPath();x.moveTo(ex+100,ey-30);x.lineTo(ex+180,ey-60);x.lineTo(ex+180,ey+60);x.lineTo(ex+100,ey+30);x.fill();
  x.strokeStyle='#556';x.stroke();
  txt('Nozzle',ex+140,ey+75,'#667',9);
  // Hydrogen input
  x.strokeStyle='#4af';x.lineWidth=2;x.setLineDash([4,3]);
  x.beginPath();x.moveTo(ex-150,ey-20);x.lineTo(ex-100,ey-20);x.stroke();
  x.beginPath();x.moveTo(ex-150,ey+20);x.lineTo(ex-100,ey+20);x.stroke();
  x.setLineDash([]);
  x.fillStyle='#4af';x.font='9px sans-serif';x.textAlign='right';x.fillText('LH₂ propellant →',ex-105,ey-25);
  // Exhaust
  if(t>0.15){
    const p=(t-0.15)/0.85;
    const elen=150+p*200;
    plume(ex+180,ey,0,elen,40+p*30,'rgba(100,200,255,0.5)',t);
    plume(ex+180,ey,0,elen*0.6,20,'rgba(255,255,255,0.3)',t);
    // H₂ exhaust label
    if(p>0.3) txt('Superheated H₂ exhaust (~2,500°C)',ex+280,ey+80,`rgba(100,200,255,${Math.min(1,(p-0.3)*2)})`,10);
  }
  // Control drums
  for(let i=0;i<4;i++){
    const dy=ey-45+i*30;
    x.fillStyle='#556';x.beginPath();x.arc(ex-70,dy,6,0,Math.PI*2);x.fill();
    x.fillStyle=t>0.1?'#5a5':'#555';x.beginPath();x.arc(ex-70,dy,4,0,Math.PI*2);x.fill();
  }
  txt('Control drums',ex-70,ey+60,'#667',8);
  // Reflector
  x.strokeStyle='#5a5';x.lineWidth=3;x.strokeRect(ex-65,ey-38,130,76);
  txt('Neutron reflector',ex+80,ey-42,'#5a5',8);
  // Turbopump
  x.fillStyle='#448';x.fillRect(ex-160,ey-15,30,30);txt('Turbo-pump',ex-145,ey+25,'#668',8);
  // Stats
  if(t>0.5){const a=Math.min(1,(t-0.5)*2);txt('Isp: 841 s (2× chemical rockets)',W/2,H-40,`rgba(126,200,227,${a})`,12);txt('23 successful test firings at Jackass Flats, Nevada',W/2,H-22,`rgba(150,150,180,${a})`,10)}
}

function drawOrion(t){
  bg('#060612','#0a0a18');stars(90);
  txt('PROJECT ORION — Nuclear Pulse Propulsion',W/2,30,'#7ec8e3',14);
  const cx=450,sy=250;
  // Ship body
  x.fillStyle='#2a2a3a';x.beginPath();x.moveTo(cx-40,sy-120);x.lineTo(cx+40,sy-120);x.lineTo(cx+50,sy+20);x.lineTo(cx-50,sy+20);x.closePath();x.fill();
  // Crew section
  x.fillStyle='#334';x.fillRect(cx-35,sy-110,70,40);txt('Crew',cx,sy-90,'#aab',9);
  // Magazine
  x.fillStyle='#443';x.fillRect(cx-30,sy-60,60,70);txt('Bomb magazine',cx,sy-25,'#aa8',8);
  // Shock absorbers
  x.strokeStyle='#668';x.lineWidth=2;
  for(let i=0;i<3;i++){x.beginPath();const bx=cx-20+i*20;for(let j=0;j<4;j++){x.lineTo(bx+(j%2?5:-5),sy+25+j*10)}x.stroke()}
  txt('Shock absorbers',cx+70,sy+40,'#668',8);
  // Pusher plate
  x.fillStyle='#556';x.fillRect(cx-70,sy+60,140,12);
  txt('Pusher plate (steel)',cx,sy+85,'#889',9);
  // Nuclear pulse sequence
  const pulseRate=5;
  const pulsePhase=(t*pulseRate)%1;
  // Bomb ejection
  if(t>0.1){
    const bombY=sy+72+pulsePhase*80;
    if(pulsePhase<0.4){
      x.fillStyle='#e74c3c';x.beginPath();x.arc(cx,bombY,4,0,Math.PI*2);x.fill();
    }
    // Explosion
    if(pulsePhase>0.4&&pulsePhase<0.9){
      const ep=(pulsePhase-0.4)/0.5;
      const fr=10+ep*100;
      const fg=x.createRadialGradient(cx,sy+160,0,cx,sy+160,fr);
      fg.addColorStop(0,`rgba(255,255,200,${0.8*(1-ep)})`);fg.addColorStop(0.4,`rgba(255,180,50,${0.5*(1-ep)})`);fg.addColorStop(1,'rgba(255,80,0,0)');
      x.fillStyle=fg;x.beginPath();x.arc(cx,sy+160,fr,0,Math.PI*2);x.fill();
      // Plasma hitting plate
      if(ep>0.3){
        x.fillStyle=`rgba(255,200,100,${0.3*(1-ep)})`;
        x.beginPath();x.moveTo(cx-60,sy+72);x.lineTo(cx,sy+160-fr*0.5);x.lineTo(cx+60,sy+72);x.fill();
      }
    }
  }
  // Velocity indicator
  if(t>0.2){const a=Math.min(1,(t-0.2)*1.5);
    txt(`Velocity: ${Math.round(t*50)} km/s`,W/2,H-40,`rgba(126,200,227,${a})`,12);
    txt('Each pulse: a small nuclear shaped charge',W/2,H-22,`rgba(150,150,180,${a})`,10);

function drawAlcubierre(t){
  bg('#020208','#060612');stars(150);
  txt('ALCUBIERRE WARP DRIVE',W/2,30,'#7ec8e3',14);
  const cx=450,cy=270;
  // Flat spacetime grid
  x.strokeStyle='rgba(60,60,100,0.3)';x.lineWidth=1;
  const warpStrength=ease(Math.min(1,t*2));
  for(let gx=-200;gx<=200;gx+=30){
    x.beginPath();
    for(let gy=-150;gy<=150;gy+=5){
      const dist=Math.sqrt(gx*gx+gy*gy);
      let dx=0;
      if(dist<120&&dist>20){
        const factor=warpStrength*(1-dist/120)*0.4;
        dx=gx>0?-factor*40:factor*40;// compress ahead, expand behind
      }
      const px=cx+gx+dx,py=cy+gy;
      if(gy===-150)x.moveTo(px,py);else x.lineTo(px,py);
    }
    x.stroke();
  }
  // Horizontal grid lines
  for(let gy=-150;gy<=150;gy+=30){
    x.beginPath();
    for(let gx=-200;gx<=200;gx+=5){
      const dist=Math.sqrt(gx*gx+gy*gy);
      let dx=0;
      if(dist<120&&dist>20){
        const factor=warpStrength*(1-dist/120)*0.4;
        dx=gx>0?-factor*40:factor*40;
      }
      const px=cx+gx+dx,py=cy+gy;
      if(gx===-200)x.moveTo(px,py);else x.lineTo(px,py);
    }
    x.stroke();
  }
  // Warp bubble
  x.strokeStyle=`rgba(100,200,255,${warpStrength*0.5})`;x.lineWidth=2;
  x.beginPath();x.ellipse(cx,cy,80*warpStrength,50*warpStrength,0,0,Math.PI*2);x.stroke();
  // Ship inside bubble (flat space)
  x.fillStyle='#556';x.beginPath();x.moveTo(cx-15,cy);x.lineTo(cx+15,cy-6);x.lineTo(cx+15,cy+6);x.closePath();x.fill();
  // Labels
  if(warpStrength>0.3){
    const a=Math.min(1,(warpStrength-0.3)*1.5);
    txt('Compressed space',cx+120,cy-20,`rgba(255,100,100,${a})`,10);
    txt('Expanded space',cx-120,cy-20,`rgba(100,100,255,${a})`,10);
    txt('Flat spacetime (no acceleration felt)',cx,cy+70,`rgba(100,200,100,${a})`,10);
  }
  // Direction arrow
  x.strokeStyle='rgba(200,200,255,0.3)';x.lineWidth=1;x.beginPath();x.moveTo(cx+100,cy);x.lineTo(cx+160,cy);x.stroke();
  x.beginPath();x.moveTo(cx+155,cy-5);x.lineTo(cx+160,cy);x.lineTo(cx+155,cy+5);x.fill();
  if(t>0.5){const a=Math.min(1,(t-0.5)*2);
    txt('Space contracts ahead, expands behind — the ship never locally exceeds c',W/2,H-38,`rgba(200,200,200,${a})`,10);
    txt('Lentz (2021): positive-energy warp solutions may exist',W/2,H-20,`rgba(126,200,227,${a})`,11);
  }
}

  x.strokeStyle='rgba(255,180,50,0.3)';x.lineWidth=2;x.beginPath();x.moveTo(cx+80,cy-15);x.lineTo(cx+100,cy-15);x.stroke();x.beginPath();x.moveTo(cx+100,cy+15);x.lineTo(cx+80,cy+15);x.stroke();

  x.fillStyle='#448';x.beginPath();x.arc(cx+200,cy,20,0,Math.PI*2);x.fill();
  if(t>0.15){x.strokeStyle='#66a';x.lineWidth=2;const spin=t*10;for(let i=0;i<4;i++){const a=i/4*Math.PI*2+spin;x.beginPath();x.moveTo(cx+200,cy);x.lineTo(cx+200+Math.cos(a)*18,cy+Math.sin(a)*18);x.stroke()}}
  txt('Turbine',cx+200,cy+30,'#668',8);
  // FREEZE PLUG (key safety feature!)
  x.fillStyle=t>0.3?'rgba(100,100,255,0.5)':'rgba(100,100,255,0.2)';
  x.fillRect(cx-5,cy+75,10,15);
  txt('Freeze plug ↑',cx,cy+100,'#88a',8);
  // Drain tank
  x.fillStyle='#2a2a3a';x.fillRect(cx-30,cy+120,60,30);x.strokeStyle='#556';x.strokeRect(cx-30,cy+120,60,30);
  txt('Drain tank',cx,cy+138,'#889',8);
  // Safety demo
  if(t>0.6){
    const a=Math.min(1,(t-0.6)*2.5);
    txt('If overheated → freeze plug melts → fuel drains to safe tank by gravity',W/2,H-38,`rgba(100,200,255,${a})`,11);
    txt('Safety depends on containment and continued decay-heat removal',W/2,H-20,`rgba(100,255,150,${a})`,11);
  }
}

function drawRTG(t){
  bg('#030308','#0a0a12');stars(100);
  txt('RADIOISOTOPE THERMOELECTRIC GENERATOR (RTG)',W/2,30,'#7ec8e3',14);
  const cx=450,cy=260;
  // RTG body
  x.fillStyle='#3a3a4a';x.fillRect(cx-60,cy-35,120,70);x.strokeStyle='#556';x.lineWidth=2;x.strokeRect(cx-60,cy-35,120,70);
  // Fins
  for(let i=0;i<6;i++){x.fillStyle='#445';x.fillRect(cx-70,cy-30+i*10,10,6);x.fillRect(cx+60,cy-30+i*10,10,6)}
  txt('Cooling fins',cx+80,cy-35,'#668',8);
  // Pu-238 fuel stack
  const glow=0.3+Math.sin(t*4)*0.05;
  x.fillStyle=`rgba(255,100,50,${glow})`;x.fillRect(cx-20,cy-25,40,50);
  x.strokeStyle='#a55';x.strokeRect(cx-20,cy-25,40,50);
  txt('Pu-238',cx,cy,'rgba(255,150,100,0.8)',9);
  // Thermocouples
  for(let i=0;i<4;i++){
    x.fillStyle='#668';x.fillRect(cx-50,cy-20+i*12,25,6);x.fillRect(cx+25,cy-20+i*12,25,6);
  }
  txt('Thermo-couples',cx-50,cy+35,'#668',7);
  // Heat flow arrows
  x.strokeStyle='rgba(255,100,50,0.3)';x.lineWidth=1;
  x.beginPath();x.moveTo(cx-20,cy);x.lineTo(cx-45,cy);x.stroke();
  x.beginPath();x.moveTo(cx+20,cy);x.lineTo(cx+45,cy);x.stroke();
  // Electricity output
  if(t>0.15){
    const a=Math.min(1,(t-0.15)*2);
    x.strokeStyle=`rgba(255,220,100,${a*0.5})`;x.lineWidth=1.5;x.setLineDash([3,3]);
    x.beginPath();x.moveTo(cx,cy-35);x.lineTo(cx,cy-80);x.stroke();x.setLineDash([]);
    txt('~110 We',cx,cy-90,`rgba(255,220,100,${a})`,11);
  }
  // Spacecraft examples
  if(t>0.3){
    const a=Math.min(1,(t-0.3)*2);
    // Voyager
    x.fillStyle=`rgba(100,100,130,${a})`;x.fillRect(150,cy-10,30,20);x.fillRect(135,cy-3,60,6);
    // Dish
    x.beginPath();x.arc(165,cy-15,15,Math.PI,0);x.fillStyle=`rgba(150,150,170,${a})`;x.fill();
    txt('Voyager 1',165,cy+20,`rgba(200,200,200,${a})`,9);
    txt('(running since 1977)',165,cy+34,`rgba(150,150,180,${a})`,8);
    // Curiosity
    x.fillStyle=`rgba(130,100,70,${a})`;x.fillRect(700,cy+5,35,15);x.fillRect(695,cy-5,10,15);x.fillRect(730,cy-5,10,15);
    x.fillRect(710,cy-10,15,10);
    txt('Curiosity',717,cy+30,`rgba(200,200,200,${a})`,9);
  }
  if(t>0.6){const a=Math.min(1,(t-0.6)*2);txt('No moving parts — Pu-238 decays for decades → heat → electricity',W/2,H-20,`rgba(126,200,227,${a})`,11)}
}

function drawPebbleBed(t){
  bg('#0a0a18','#0a0a18');
  txt('PEBBLE BED REACTOR — TRISO Fuel',W/2,30,'#7ec8e3',14);
  const cx=400,cy=270;
  // Reactor vessel
  x.fillStyle='#2a2a3a';x.beginPath();x.moveTo(cx-60,cy-100);x.lineTo(cx+60,cy-100);x.lineTo(cx+70,cy+80);x.lineTo(cx-70,cy+80);x.closePath();x.fill();x.strokeStyle='#556';x.lineWidth=2;x.stroke();
  // Pebbles
  const glow=t>0.1?0.2+Math.sin(t*5)*0.05:0.05;
  for(let i=0;i<40;i++){
    const px=cx-45+((i*37)%90);
    const py=cy-80+((i*53)%150);
    x.fillStyle=`rgba(150,150,160,0.6)`;x.beginPath();x.arc(px,py,6,0,Math.PI*2);x.fill();
    x.fillStyle=`rgba(80,200,100,${glow})`;x.beginPath();x.arc(px,py,3,0,Math.PI*2);x.fill();
  }
  // TRISO cutaway (zoomed)
  const tx=700,ty=180;
  x.strokeStyle='#889';x.lineWidth=1;x.setLineDash([3,3]);x.beginPath();x.moveTo(cx+50,cy-60);x.lineTo(tx-40,ty);x.stroke();x.setLineDash([]);
  // Pebble cross section
  x.fillStyle='#888';x.beginPath();x.arc(tx,ty,35,0,Math.PI*2);x.fill();
  txt('Graphite matrix',tx,ty-42,'#aab',8);
  // TRISO particles inside
  for(let i=0;i<7;i++){
    const px2=tx-15+((i*11)%30);
    const py2=ty-15+((i*17)%30);
    // Layers of TRISO
    x.fillStyle='#a55';x.beginPath();x.arc(px2,py2,5,0,Math.PI*2);x.fill();//SiC
    x.fillStyle='#555';x.beginPath();x.arc(px2,py2,3.5,0,Math.PI*2);x.fill();//PyC
    x.fillStyle='#5a5';x.beginPath();x.arc(px2,py2,2,0,Math.PI*2);x.fill();//UO2
  }
  // TRISO detail
  txt('TRISO particle →',tx+45,ty,'#889',8,'left');
  txt('UO₂ kernel',tx+45,ty+15,'#5a5',7,'left');
  txt('PyC buffer',tx+45,ty+28,'#888',7,'left');
  txt('SiC barrier',tx+45,ty+41,'#a55',7,'left');
  // Helium coolant flow
  x.strokeStyle='rgba(100,200,255,0.3)';x.lineWidth=1.5;
  for(let i=0;i<3;i++){
    const fx=cx-30+i*30;
    x.beginPath();x.moveTo(fx,cy-90);x.lineTo(fx,cy+70);x.stroke();
    // Arrows
    x.fillStyle='rgba(100,200,255,0.4)';x.beginPath();x.moveTo(fx-3,cy+60);x.lineTo(fx,cy+70);x.lineTo(fx+3,cy+60);x.fill();
  }
  txt('He coolant ↓',cx-60,cy+90,'#5ab',8);
  if(t>0.5){const a=Math.min(1,(t-0.5)*2);
    txt('TRISO containment and decay-heat removal have design-specific limits',W/2,H-38,`rgba(100,255,150,${a})`,11);
    txt("China's HTR-PM: first commercial pebble bed reactor (2023)",W/2,H-20,`rgba(200,200,200,${a})`,10);
  }
}

function drawSNAP(t){
  bg('#030308','#0a0a18');stars(100);
  // Earth curve
  x.fillStyle='#1a3a6a';x.beginPath();x.ellipse(450,H+350,500,400,0,Math.PI,0);x.fill();
  x.fillStyle='#2a5a3a';x.beginPath();x.ellipse(400,H+350,300,390,0.2,Math.PI+0.3,Math.PI+1.5);x.fill();
  txt('SNAP-10A — First Nuclear Reactor in Space (1965)',W/2,30,'#7ec8e3',14);
  // Satellite body
  const sx=450,sy=200;
  x.fillStyle='#3a3a4a';x.fillRect(sx-15,sy-20,30,40);
  // Reactor (top, cone-shaped)
  const glow=t>0.1?0.3+Math.sin(t*6)*0.1:0.05;
  x.fillStyle=`rgba(50,200,80,${glow})`;
  x.beginPath();x.moveTo(sx-10,sy-20);x.lineTo(sx,sy-40);x.lineTo(sx+10,sy-20);x.fill();
  txt('Reactor',sx,sy-48,`rgba(100,255,150,${glow+0.2})`,8);
  // NaK coolant pipes
  x.strokeStyle='#a55';x.lineWidth=1;
  x.beginPath();x.moveTo(sx-10,sy-15);x.lineTo(sx-25,sy);x.lineTo(sx-10,sy+15);x.stroke();
  x.beginPath();x.moveTo(sx+10,sy-15);x.lineTo(sx+25,sy);x.lineTo(sx+10,sy+15);x.stroke();
  // Thermoelectric converter
  x.fillStyle='#448';x.fillRect(sx-12,sy+5,24,10);txt('TE converter',sx+25,sy+12,'#668',7);
  // Radiator cone
  x.strokeStyle='#667';x.lineWidth=1;
  x.beginPath();x.moveTo(sx-15,sy+20);x.lineTo(sx-40,sy+60);x.stroke();
  x.beginPath();x.moveTo(sx+15,sy+20);x.lineTo(sx+40,sy+60);x.stroke();
  x.beginPath();x.moveTo(sx-40,sy+60);x.lineTo(sx+40,sy+60);x.stroke();
  txt('Radiator',sx,sy+70,'#778',8);
  // Agena bus
  x.fillStyle='#334';x.fillRect(sx-12,sy+75,24,40);txt('Agena bus',sx,sy+100,'#556',7);
  // Orbit path
  x.strokeStyle='rgba(100,150,255,0.15)';x.lineWidth=1;x.setLineDash([5,5]);
  x.beginPath();x.ellipse(450,H+350,420,160,-0.1,Math.PI+0.8,Math.PI+2.3);x.stroke();x.setLineDash([]);
  // Power output label
  if(t>0.2){const a=Math.min(1,(t-0.2)*2);
    txt('500 We output',sx+60,sy-30,`rgba(255,220,100,${a})`,10,'left');
    // Power beam
    x.strokeStyle=`rgba(255,220,100,${a*0.3})`;x.lineWidth=1;x.setLineDash([3,3]);x.beginPath();x.moveTo(sx+15,sy-20);x.lineTo(sx+55,sy-32);x.stroke();x.setLineDash([]);
  }
  // Soviet comparison
  if(t>0.5){const a=Math.min(1,(t-0.5)*2);
    txt('US: 1 space reactor (SNAP-10A)',250,H-55,`rgba(200,200,200,${a})`,10);
    txt('USSR: 30+ RORSAT reactors in orbit',250,H-38,`rgba(200,200,200,${a})`,10);
    txt('Operated 43 days before voltage regulator failure (not reactor)',W/2,H-18,`rgba(150,150,180,${a})`,10);
  }
}
