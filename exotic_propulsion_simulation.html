<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exotic Propulsion Systems — Simulation Laboratory</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #e0e0e8; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }

  .header { text-align: center; padding: 30px 20px 10px; background: linear-gradient(180deg, #12122a 0%, #0a0a12 100%); }
  .header h1 { font-size: 1.8em; background: linear-gradient(90deg, #00d4ff, #7b5ea7, #ff6ec7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header p { color: #8888aa; margin-top: 6px; font-size: 0.9em; }

  .nav-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 16px 10px; background: #0e0e1a; border-bottom: 1px solid #1a1a2e; position: sticky; top: 0; z-index: 100; }
  .nav-btn { padding: 6px 12px; border: 1px solid #2a2a4a; border-radius: 20px; background: #14142a; color: #9999bb; cursor: pointer; font-size: 0.75em; transition: all 0.3s; }
  .nav-btn:hover { border-color: #5555aa; color: #ccccee; }
  .nav-btn.active { background: linear-gradient(135deg, #2a1a5e, #1a3a6e); border-color: #6666cc; color: #fff; box-shadow: 0 0 12px rgba(100,100,255,0.3); }

  .sim-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .sim-panel { display: none; }
  .sim-panel.active { display: block; }

  .sim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
  @media (max-width: 800px) { .sim-grid { grid-template-columns: 1fr; } }

  .card { background: #12122a; border: 1px solid #1e1e3a; border-radius: 12px; padding: 20px; }
  .card h3 { color: #7ba4ff; font-size: 1em; margin-bottom: 10px; }
  .card p, .card li { font-size: 0.85em; line-height: 1.6; color: #aaaacc; }
  .card ul { padding-left: 18px; }

  canvas { width: 100%; border-radius: 10px; background: #08081a; border: 1px solid #1a1a2e; }

  .info-banner { background: linear-gradient(135deg, #1a1040, #0a2040); border: 1px solid #2a2a5a; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .info-banner h2 { font-size: 1.2em; color: #8fb8ff; margin-bottom: 6px; }
  .info-banner .subtitle { font-size: 0.8em; color: #ff9d5c; margin-bottom: 8px; }
  .info-banner p { font-size: 0.82em; color: #9999bb; line-height: 1.6; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0; }
  .ctrl-group { display: flex; flex-direction: column; gap: 3px; }
  .ctrl-group label { font-size: 0.7em; color: #7777aa; text-transform: uppercase; letter-spacing: 1px; }
  .ctrl-group input[type=range] { width: 140px; accent-color: #6666cc; }
  .ctrl-group .val { font-size: 0.75em; color: #aaaadd; text-align: center; }

  .metric-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
  .metric { background: #0e0e20; border: 1px solid #1e1e3a; border-radius: 8px; padding: 8px 14px; min-width: 120px; }
  .metric .label { font-size: 0.65em; color: #6666aa; text-transform: uppercase; letter-spacing: 1px; }
  .metric .value { font-size: 1.1em; color: #00d4ff; font-weight: 600; margin-top: 2px; }

  .eq { background: #0a0a1e; border: 1px solid #1a1a3a; border-radius: 6px; padding: 10px 14px; margin: 8px 0; font-family: 'Courier New', monospace; font-size: 0.82em; color: #ccaaff; overflow-x: auto; white-space: pre-wrap; }

  .patent-tag { display: inline-block; background: #2a1a0a; border: 1px solid #cc8833; color: #ffaa55; font-size: 0.7em; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; }

  .run-btn { padding: 8px 20px; border: none; border-radius: 20px; background: linear-gradient(135deg, #4040aa, #6030a0); color: #fff; cursor: pointer; font-size: 0.85em; transition: all 0.3s; }
  .run-btn:hover { box-shadow: 0 0 20px rgba(100,60,200,0.5); transform: scale(1.03); }
  button:focus-visible, input:focus-visible { outline: 3px solid #ffd18c; outline-offset: 3px; }
  .model-note { color: #e8c792; line-height: 1.5; font-size: .83rem; margin: 8px 0 14px; }
  .playback-status { color: #b8b8d8; font-size: .85rem; }
  .sim-grid > *, .card { min-width: 0; }
  .metric .value { overflow-wrap: anywhere; }
  .ctrl-group label, .metric .label { color: #a9a9ce; }
  [hidden] { display: none !important; }
  @media(max-width: 500px) { .sim-container { padding: 12px; } .card { padding: 12px; } .nav-bar { position: static; } .nav-btn { min-height: 40px; } }
</style>
</head>
<body>

<div class="header">
  <h1>Exotic Propulsion Simulation Laboratory</h1>
  <p>10 Drive Concepts — Interactive, Unvalidated Illustrations</p>
</div>

<div class="nav-bar" id="navBar"></div>

<div class="sim-container" id="simContainer"></div>

<script>
const METHODS = [
  {
    id: "pais-ief",
    name: "1. Pais Inertial Mass Reduction",
    short: "Pais IEF Drive",
    patent: "US Patent 10,144,532 — Craft Using an Inertial Mass Reduction Device",
    subtitle: "US Navy — Salvatore Cezar Pais (2018)",
    desc: `The Pais Effect proposes that by spinning electrically charged matter at extreme angular velocities within a rapidly rotating cavity, the resulting high-energy electromagnetic field interactions can locally reduce the inertial mass of the craft. This exploits the quantum vacuum fluctuation energy density to create an asymmetric polarization of the local vacuum, effectively decoupling inertial mass from gravitational mass. The craft would experience dramatically reduced resistance to acceleration, enabling instantaneous velocity changes and hypersonic flight without inertial effects on occupants.`,
    equations: [
      "F_drive = m₀·a · (1 − η_reduction)",
      "η_reduction = (μ₀·σ·ω²·r⁴·E²) / (8·m₀·c⁴)",
      "E_vacuum = ℏω³ / (2π²c³)  — Zero-point energy density",
      "Δm_inertial = m₀ · [1 − exp(−α·B²·ω/c²)]",
      "Where: σ = charge density, ω = angular velocity",
      "r = cavity radius, B = magnetic flux density"
    ],
    params: [
      { name: "Angular Velocity (rad/s)", key: "omega", min: 1e4, max: 1e8, init: 1e6, log: true },
      { name: "Cavity Radius (m)", key: "radius", min: 0.5, max: 5, init: 2, log: false },
      { name: "Charge Density (C/m³)", key: "sigma", min: 1e3, max: 1e8, init: 1e5, log: true },
      { name: "Magnetic Field (T)", key: "B", min: 1, max: 50, init: 10, log: false }
    ],
    simulate: function(p, canvas) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W/2, cy = H/2;

      const c = 3e8, mu0 = 1.2566e-6, hbar = 1.0546e-34;
      const m0 = 5000; // craft mass kg
      const alpha = 1e-18;
      const eta = Math.min(0.999, (mu0 * p.sigma * p.omega*p.omega * Math.pow(p.radius,4) * p.B*p.B) / (8 * m0 * Math.pow(c,4)));
      const effectiveMass = m0 * (1 - eta);
      const maxAccel = eta > 0.01 ? (1e6 / effectiveMass) : (1e6 / m0);
      const maxG = maxAccel / 9.81;

      let t = 0;
      function draw(frameScale = 0) {
        ctx.fillStyle = 'rgba(8,8,26,0.15)';
        ctx.fillRect(0,0,W,H);

        t += 0.02 * frameScale;

        // Draw vacuum energy field
        for (let i = 0; i < 60; i++) {
          const angle = (i / 60) * Math.PI * 2 + t * 0.3;
          const dist = 80 + Math.sin(t * 2 + i * 0.5) * 20 * eta * 100;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          const intensity = eta * 200;
          ctx.beginPath();
          ctx.arc(x, y, 1.5 + eta * 3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(100,150,255,${0.2 + intensity/400})`;
          ctx.fill();
        }

        // Rotating cavity visualization
        const rings = 5;
        for (let r = 0; r < rings; r++) {
          const rad = 30 + r * 18;
          const rotSpeed = (p.omega / 1e6) * (1 + r * 0.3);
          ctx.beginPath();
          ctx.strokeStyle = `rgba(${100 + r*30}, ${100 + eta*200}, 255, ${0.3 + eta * 0.5})`;
          ctx.lineWidth = 1.5 + eta * 2;
          for (let a = 0; a < Math.PI * 2; a += 0.05) {
            const wobble = Math.sin(a * 8 + t * rotSpeed) * (3 + eta * 10);
            const px = cx + Math.cos(a) * (rad + wobble);
            const py = cy + Math.sin(a) * (rad + wobble);
            if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
        }

        // Central craft
        const glow = 15 + eta * 60;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glow);
        grad.addColorStop(0, `rgba(200,220,255,${0.8 + eta * 0.2})`);
        grad.addColorStop(0.5, `rgba(100,140,255,${0.4 * eta})`);
        grad.addColorStop(1, 'rgba(50,80,200,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, glow, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Craft triangle
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t * (p.omega / 1e7));
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(15, 12);
        ctx.lineTo(-15, 12);
        ctx.closePath();
        ctx.fillStyle = '#c0c8e0';
        ctx.fill();
        ctx.strokeStyle = '#6688cc';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        // Mass reduction visualization — particle ejection
        if (eta > 0.01) {
          for (let i = 0; i < Math.floor(eta * 30); i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 100 + Math.random() * 80;
            const x = cx + Math.cos(angle + t) * dist;
            const y = cy + Math.sin(angle + t) * dist;
            ctx.beginPath();
            ctx.arc(x, y, 0.8, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,180,100,${0.1 + Math.random() * 0.3})`;
            ctx.fill();
          }
        }


      }

      return {
        draw,
        metrics: [
          { label: "Mass Reduction", value: (eta * 100).toFixed(4) + "%" },
          { label: "Effective Mass", value: effectiveMass.toFixed(1) + " kg" },
          { label: "Max Acceleration", value: maxAccel.toExponential(2) + " m/s²" },
          { label: "Max G-Force Equiv", value: maxG.toExponential(2) + " g" },
          { label: "Vacuum Energy Coupling", value: (eta * 1e15).toExponential(2) + " J/m³" }
        ]
      };
    }
  },
  {
    id: "pais-hfgw",
    name: "2. Pais High-Freq Gravitational Wave Generator",
    short: "HFGW Generator",
    patent: "US Patent 10,322,827 — High Frequency Gravitational Wave Generator",
    subtitle: "US Navy — Salvatore Cezar Pais (2019)",
    desc: `This patent describes generating high-frequency gravitational waves (HFGWs) through controlled vibration of an electrically charged mass at extremely high frequencies. By accelerating an electrified gas or plasma in a rapid, controlled manner inside an accelerator cavity, the resulting gravitational wave emissions could theoretically create a propulsive pressure gradient. The device uses a microwave emitter to vibrate a charged medium, generating gravitational radiation at GHz frequencies — far beyond anything detectable by LIGO. This could create localized spacetime curvature gradients for propulsion.`,
    equations: [
      "P_gw = (G/5c⁵) · (d³Q_ij/dt³)²  — Quadrupole radiation",
      "h_strain = (4G·M·ω²·r²) / (c⁴·R)",
      "F_prop = (c²/16πG) · ∫ (∂h/∂z)² dA",
      "ω_gw = 2π·f_microwave · N_harmonics",
      "E_input = P_microwave · Q_cavity · τ_coherence"
    ],
    params: [
      { name: "Frequency (GHz)", key: "freq", min: 1, max: 300, init: 50, log: false },
      { name: "Cavity Q-Factor", key: "Q", min: 1e3, max: 1e9, init: 1e6, log: true },
      { name: "Input Power (MW)", key: "power", min: 0.1, max: 1000, init: 10, log: true },
      { name: "Charge Mass (kg)", key: "mass", min: 0.01, max: 10, init: 0.5, log: true }
    ],
    simulate: function(p, canvas) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W/2, cy = H/2;
      const G = 6.674e-11, c = 3e8;

      const omega = 2 * Math.PI * p.freq * 1e9;
      const Pgw = (G / (5 * Math.pow(c, 5))) * Math.pow(p.mass * omega * omega * 0.1, 2) * p.Q;
      const strain = Math.min(1e-10, (4 * G * p.mass * omega * omega * 0.01) / (Math.pow(c, 4) * 1));
      const strainNorm = Math.log10(strain + 1e-40) / -10;

      let t = 0;
      function draw(frameScale = 0) {
        ctx.fillStyle = 'rgba(8,8,26,0.12)';
        ctx.fillRect(0,0,W,H);
        t += 0.03 * frameScale;

        // Gravitational wave rings
        const numWaves = 12;
        for (let i = 0; i < numWaves; i++) {
          const phase = (t * p.freq / 10 + i / numWaves * Math.PI * 2) % (Math.PI * 2);
          const radius = (phase / (Math.PI * 2)) * Math.max(W, H) * 0.6;
          const alpha = Math.max(0, 0.6 - radius / (W * 0.5));

          ctx.beginPath();
          for (let a = 0; a < Math.PI * 2; a += 0.03) {
            const stretch = 1 + 0.15 * Math.sin(2 * a) * Math.exp(-radius / 200) * (p.power / 10);
            const px = cx + Math.cos(a) * radius * stretch;
            const py = cy + Math.sin(a) * radius / stretch;
            if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.strokeStyle = `rgba(180,120,255,${alpha})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // Central cavity
        const cavGlow = 20 + p.power * 0.5;
        const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cavGlow);
        cg.addColorStop(0, `rgba(255,200,100,0.9)`);
        cg.addColorStop(0.4, `rgba(200,100,255,0.4)`);
        cg.addColorStop(1, 'rgba(100,50,200,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, cavGlow, 0, Math.PI * 2);
        ctx.fillStyle = cg;
        ctx.fill();

        // Vibrating charged particles inside cavity
        for (let i = 0; i < 20; i++) {
          const angle = (i / 20) * Math.PI * 2;
          const vibr = Math.sin(t * p.freq / 5 + i * 3) * 8;
          const px = cx + Math.cos(angle) * (12 + vibr);
          const py = cy + Math.sin(angle) * (12 + vibr);
          ctx.beginPath();
          ctx.arc(px, py, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,200,${0.5 + Math.sin(t*5+i)*0.3})`;
          ctx.fill();
        }

        // Spacetime grid distortion
        ctx.strokeStyle = 'rgba(60,80,120,0.15)';
        ctx.lineWidth = 0.5;
        const gridSize = 30;
        for (let gx = 0; gx < W; gx += gridSize) {
          ctx.beginPath();
          for (let gy = 0; gy < H; gy += 3) {
            const dx = gx - cx, dy = gy - cy;
            const dist = Math.sqrt(dx*dx + dy*dy) + 1;
            const warp = Math.sin(t * 3 - dist / 30) * (p.power / dist) * 5;
            const px = gx + warp * (dx / dist);
            if (gy === 0) ctx.moveTo(px, gy); else ctx.lineTo(px, gy);
          }
          ctx.stroke();
        }


      }
      return {
        draw,
        metrics: [
          { label: "GW Power Output", value: Pgw.toExponential(2) + " W" },
          { label: "Strain Amplitude", value: strain.toExponential(2) },
          { label: "Wave Frequency", value: (p.freq).toFixed(1) + " GHz" },
          { label: "Cavity Energy", value: (p.power * 1e6 * p.Q / (p.freq * 1e9)).toExponential(2) + " J" }
        ]
      };
    }
  },
  {
    id: "pais-plasma",
    name: "3. Pais Plasma Compression Fusion",
    short: "Plasma Fusion",
    patent: "US Patent 11,313,243 — Plasma Compression Fusion Device",
    subtitle: "US Navy — Salvatore Cezar Pais (2021)",
    desc: `This Navy patent describes a compact fusion reactor using a combination of electromagnetic and electrostatic fields to confine and compress plasma to fusion conditions. Unlike tokamak or stellarator designs, this device uses a dynamic shell of counter-rotating plasma layers that self-compress through their own electromagnetic interactions. The extreme energy density achieved could power the other Pais-effect devices. The patent claims the ability to achieve fusion breakeven in a device small enough to fit inside an aircraft, potentially producing terawatts of power for mass reduction and gravitational wave generation.`,
    equations: [
      "n·τ·T > 5×10²¹ keV·s/m³  — Lawson criterion",
      "P_fusion = n²·⟨σv⟩·E_reaction·V / 4",
      "B_confinement = √(2μ₀·n·k_B·T)",
      "β_plasma = 2μ₀·n·k_B·T / B²",
      "τ_E = W_plasma / P_loss",
      "Compression ratio: ρ/ρ₀ = (B/B₀)² × (r₀/r)⁴"
    ],
    params: [
      { name: "Plasma Temp (keV)", key: "temp", min: 1, max: 200, init: 50, log: false },
      { name: "Magnetic Field (T)", key: "B", min: 5, max: 200, init: 50, log: false },
      { name: "Density (×10²⁰/m³)", key: "density", min: 1, max: 1000, init: 100, log: true },
      { name: "Chamber Radius (m)", key: "radius", min: 0.1, max: 2, init: 0.5, log: false }
    ],
    simulate: function(p, canvas) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W/2, cy = H/2;

      const n = p.density * 1e20;
      const T_kelvin = p.temp * 1.16e7;
      const kB = 1.38e-23;
      const mu0 = 1.2566e-6;
      const beta = (2 * mu0 * n * kB * T_kelvin) / (p.B * p.B);
      const volume = (4/3) * Math.PI * Math.pow(p.radius, 3);
      // D-T fusion cross section estimate
      const sigmaV = 3.68e-18 * Math.exp(-19.94 / Math.sqrt(p.temp)) * 1e-6;
      const Pfusion = n * n * sigmaV * 17.6 * 1.6e-13 * volume / 4;
      const Wplasma = 1.5 * n * kB * T_kelvin * volume;
      const lawson = n * (Wplasma / Math.max(Pfusion, 1)) * p.temp;

      let t = 0;
      let particles = [];
      for (let i = 0; i < 200; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * 60;
        particles.push({ angle, r, speed: 0.5 + Math.random() * 2, vr: (Math.random() - 0.5) * 2, layer: Math.floor(Math.random() * 3) });
      }

      function draw(frameScale = 0) {
        ctx.fillStyle = 'rgba(8,8,26,0.15)';
        ctx.fillRect(0,0,W,H);
        t += 0.02 * frameScale;

        // Magnetic confinement field lines
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2 + t * 0.1;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(60,100,200,${0.15 + beta * 0.1})`;
          ctx.lineWidth = 1;
          for (let s = 0; s < 100; s++) {
            const frac = s / 100;
            const r = 90 * frac;
            const a = angle + frac * Math.PI * 2;
            const px = cx + Math.cos(a) * r;
            const py = cy + Math.sin(a) * r * 0.6;
            if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        // Counter-rotating plasma layers
        const layers = [
          { r: 65, color: [255, 80, 60], dir: 1 },
          { r: 45, color: [255, 180, 40], dir: -1 },
          { r: 25, color: [255, 255, 200], dir: 1 }
        ];
        layers.forEach((layer, li) => {
          const comprR = layer.r * Math.max(0.15, 1 - Math.min(beta, 2) * 0.3);
          for (let i = 0; i < 30; i++) {
            const a = (i / 30) * Math.PI * 2 + t * layer.dir * (1 + li * 0.5);
            const wobble = Math.sin(a * 5 + t * 3) * 3;
            const px = cx + Math.cos(a) * (comprR + wobble);
            const py = cy + Math.sin(a) * (comprR + wobble) * 0.7;
            ctx.beginPath();
            ctx.arc(px, py, 1.5 + (2 - li), 0, Math.PI * 2);
            const alpha = 0.4 + Math.sin(t * 5 + i) * 0.2;
            ctx.fillStyle = `rgba(${layer.color[0]},${layer.color[1]},${layer.color[2]},${alpha})`;
            ctx.fill();
          }
        });

        // Fusion events (flashes)
        if (Pfusion > 1e6) {
          const flashCount = Math.min(10, Math.log10(Pfusion) - 5);
          for (let i = 0; i < flashCount; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = Math.random() * 20;
            const fx = cx + Math.cos(a) * r;
            const fy = cy + Math.sin(a) * r * 0.7;
            const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, 8);
            fg.addColorStop(0, 'rgba(255,255,255,0.8)');
            fg.addColorStop(0.5, 'rgba(255,200,100,0.3)');
            fg.addColorStop(1, 'rgba(255,100,50,0)');
            ctx.beginPath();
            ctx.arc(fx, fy, 8, 0, Math.PI * 2);
            ctx.fillStyle = fg;
            ctx.fill();
          }
        }

        // Core glow
        const coreR = 15 + Math.min(beta, 4) * 20;
        const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
        cg.addColorStop(0, `rgba(255,255,240,${0.3 + Math.min(0.7, Pfusion/1e12)})`);
        cg.addColorStop(0.5, `rgba(255,180,60,${0.2 + beta * 0.3})`);
        cg.addColorStop(1, 'rgba(200,80,30,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
        ctx.fillStyle = cg;
        ctx.fill();


      }
      return {
        draw,
        metrics: [
          { label: "Fusion Power", value: Pfusion.toExponential(2) + " W" },
          { label: "Plasma Beta", value: beta.toFixed(4) },
          { label: "Plasma Energy", value: Wplasma.toExponential(2) + " J" },
          { label: "Lawson Parameter", value: lawson.toExponential(2) + " keV·s/m³" },
          { label: "Toy 0.1 s threshold", value: Pfusion > Wplasma / 0.1 ? "Above" : "Below" }
        ]
      };
    }
  },
  {
    id: "alcubierre",
    name: "4. Alcubierre Warp Drive",
    short: "Warp Drive",

function cancelFrame() {
  if (animationId !== null) cancelAnimationFrame(animationId);
  animationId = null;
  lastTimestamp = null;
}
function updatePlayback() {
  const state = panels[activeIndex];
  state.play.textContent = playing ? '⏸ Pause' : '▶ Play';
  state.play.setAttribute('aria-pressed', String(playing));
  const status = document.hidden && playing ? 'Suspended while hidden' : playing ? 'Playing' : 'Paused';
  if (state.status.textContent !== status) state.status.textContent = status;
  state.timer.textContent = `· ${elapsed.toFixed(1)} s illustration time`;
}
function scheduleFrame() {
  if (playing && !document.hidden && animationId === null) animationId = requestAnimationFrame(tick);
}
function tick(timestamp) {
  animationId = null;
  if (!playing || document.hidden) return;
  const delta = lastTimestamp === null ? 0 : Math.min(0.1, Math.max(0, (timestamp - lastTimestamp) / 1000));
  lastTimestamp = timestamp;
  elapsed += delta;
  currentResult.draw(delta * 60);
  updatePlayback();
  scheduleFrame();
}
function refresh() {
  cancelFrame();
  elapsed = 0;
  const state = panels[activeIndex];
  state.canvas.getContext('2d').clearRect(0, 0, state.canvas.width, state.canvas.height);
  currentResult = METHODS[activeIndex].simulate({...state.values}, state.canvas);
  state.metrics.replaceChildren();
  currentResult.metrics.forEach(metric => {
    const card = document.createElement('div');
    card.className = 'metric';
    const label = document.createElement('div');
    label.className = 'label'; label.textContent = metric.label;
    const value = document.createElement('div');
    value.className = 'value'; value.textContent = metric.value;
    card.append(label, value); state.metrics.append(card);
  });
  currentResult.draw(0);
  updatePlayback(); scheduleFrame();
}

  tab.type = 'button'; tab.className = 'nav-btn'; tab.textContent = method.short;
  tab.id = 'tab-' + method.id;
  tab.setAttribute('role', 'tab'); tab.setAttribute('aria-controls', 'panel-' + method.id);
  tab.onclick = () => selectMethod(index);
  tab.onkeydown = event => {
    let next;
    if (event.key === 'ArrowRight') next = (index + 1) % METHODS.length;
    if (event.key === 'ArrowLeft') next = (index - 1 + METHODS.length) % METHODS.length;
    if (event.key === 'Home') next = 0;
    if (event.key === 'End') next = METHODS.length - 1;
    if (next !== undefined) { event.preventDefault(); selectMethod(next); panels[next].tab.focus(); }
  };
  navBar.append(tab);
  const panel = document.createElement('section');
  panel.className = 'sim-panel'; panel.id = 'panel-' + method.id;
  panel.setAttribute('role', 'tabpanel'); panel.setAttribute('aria-labelledby', tab.id);
  panel.innerHTML = `
    <div class="info-banner">
      ${method.patent ? `<span class="patent-tag">${method.patent}</span>` : ''}
      <h2>${method.name}</h2><div class="subtitle">${method.subtitle}</div>
      <p class="model-note">Conceptual illustration — unvalidated formulas and assumed scaling. A patent or displayed number does not establish that a drive works.</p>
      <details><summary>Original concept narrative (claims, not validation)</summary><p>${method.desc}</p></details>
    </div>
    <details><summary>Illustrative equations — not validated performance models</summary><div class="eq">${method.equations.join('\n')}</div></details>
    <div class="controls" id="controls-${method.id}"></div>
    <div class="controls playback"><button type="button" class="run-btn play-btn">▶ Play</button><button type="button" class="run-btn replay-btn">↺ Replay</button><button type="button" class="run-btn reset-btn">Reset parameters</button><span class="playback-status" role="status"></span><span class="elapsed playback-status" aria-live="off"></span></div>
    <div class="sim-grid"><div class="card"><h3>Concept animation</h3>
      <canvas id="canvas-${method.id}" width="500" height="350" role="img" aria-label="${method.short}: conceptual animation, not to scale">Concept animation; the adjacent text describes this illustration.</canvas>
      <p>Time and visual amplitudes are scaled for display. Parameter changes restart the illustration and refresh its numbers.</p></div>
      <div class="card"><h3>Illustrative outputs</h3><p class="model-note">These outputs come from unvalidated toy formulas, not measurements or engineering predictions. Display limits can flatten responses; not every input appears in every formula.</p><div class="metric-row" id="metrics-${method.id}"></div></div></div>`;
  container.append(panel);
  const state = {tab, panel, values: {}, inputs: [], canvas: panel.querySelector('canvas'), metrics: panel.querySelector('.metric-row'), play: panel.querySelector('.play-btn'), status: panel.querySelector('.playback-status'), timer: panel.querySelector('.elapsed')};
  panels.push(state);
  method.params.forEach(param => {
    const group = document.createElement('div'); group.className = 'ctrl-group';
    const label = document.createElement('label'); label.textContent = param.name;
    const input = document.createElement('input'); input.type = 'range'; input.id = `${method.id}-${param.key}`;
    label.htmlFor = input.id;
    input.min = param.min; input.max = param.max; input.step = param.integer ? 1 : 'any';
    if (param.log) { input.min = Math.log10(param.min); input.max = Math.log10(param.max); }
    const output = document.createElement('output'); output.className = 'val'; output.htmlFor = input.id;
    function setValue(value) {
      state.values[param.key] = value;
      input.value = param.log ? Math.log10(value) : value;
      output.textContent = formatVal(value);
      input.setAttribute('aria-valuetext', `${formatVal(value)} ${param.name}${param.log ? ' (logarithmic scale)' : ''}`);
    }
    input.oninput = () => {
      const value = param.log ? 10 ** Number(input.value) : Number(input.value);
      setValue(param.integer ? Math.round(value) : value);
      if (activeIndex === index) refresh();
    };
    setValue(param.init); state.inputs.push(() => setValue(param.init));
    group.append(label, input, output); panel.querySelector('.controls').append(group);
  });
  state.play.onclick = () => { playing = !playing; cancelFrame(); updatePlayback(); scheduleFrame(); };
  panel.querySelector('.replay-btn').onclick = () => { playing = true; refresh(); };
  panel.querySelector('.reset-btn').onclick = () => { state.inputs.forEach(reset => reset()); playing = false; refresh(); };
});
function selectMethod(index) {
  cancelFrame(); activeIndex = index;
  panels.forEach((state, i) => {
    state.tab.classList.toggle('active', i === index); state.tab.tabIndex = i === index ? 0 : -1;
    state.tab.setAttribute('aria-selected', String(i === index));
    state.panel.classList.toggle('active', i === index); state.panel.hidden = i !== index;
  });
  refresh();
}
document.addEventListener('visibilitychange', () => { cancelFrame(); updatePlayback(); scheduleFrame(); });
window.addEventListener('pagehide', cancelFrame);
window.addEventListener('pageshow', scheduleFrame);
selectMethod(0);

function formatVal(v) {
  if (Math.abs(v) >= 1e6) return v.toExponential(2);
  if (Math.abs(v) >= 1000) return v.toFixed(0);
  if (Math.abs(v) >= 1) return v.toFixed(2);
  if (Math.abs(v) >= 0.01) return v.toFixed(4);
  return v.toExponential(2);
}
</script>
</body>
</html>
